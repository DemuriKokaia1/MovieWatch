<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MovieWatch</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="index">

  <header>
    <nav>
      <span class="nav__logo">MovieWatch</span>
      <div class="nav__links">
        <a href="index.html">Search</a>
        <a href="watchlist.html">Watchlist</a>
      </div>
    </nav>
  </header>

  <main>

    <section class="search-section">
      <h1 class="search-section__title">Find Movies & Shows</h1>

      <form id="search-form" class="search-form">

        <input
          type="text"
          id="search-input"
          name="query"
          class="search-form__input"
          placeholder="Search movies or shows…"
          
          minlength="1"
          autocomplete="off"
        >

        <select id="type-filter" name="type" class="search-form__select">
          <option value="">All types</option>
          <option value="movie">Movies</option>
          <option value="series">Series</option>
          <option value="episode">Episodes</option>
        </select>

        <label class="search-form__checkbox-label">
          <input type="checkbox" id="rated-only" name="rated" class="search-form__checkbox">
          Rated titles only
        </label>

        <button type="submit" class="search-form__btn">Search</button>

      </form>
    </section>

    <p id="loading-msg" hidden>Loading…</p>
    <p id="error-msg" hidden></p>

    <section class="results-section">
      <div id="results-grid" class="results-grid"></div>
    </section>

  </main>

  <footer class="footer">
    <p>MovieWatch</p>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>
</html>
